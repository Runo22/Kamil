name: build

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset x64-release
      - name: Build
        run: cmake --build --preset x64-release
      - name: Test
        run: ctest --preset x64-release
      - uses: actions/upload-artifact@v4
        with:
          name: Kamil-x64-release
          path: out/build/x64-release/Kamil.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Core unit tests
        run: |
          cmake --preset linux-tests
          cmake --build --preset linux-tests -j
          ctest --preset linux-tests
      - name: MinGW compile check
        run: |
          cmake --preset mingw-check
          cmake --build --preset mingw-check -j
